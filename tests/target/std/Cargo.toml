[package]
name = "toolchain-std"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false
[workspace]
[[bin]]
name = "toolchain-std"
path = "src/main.rs"
test = false
bench = false
[profile.release]
panic = "abort"

[[bin]]
name = "std-panic"
path = "src/panic/main.rs"
test = false
bench = false

[[bin]]
name = "std-exit"
path = "src/exit/main.rs"
test = false
bench = false

[[bin]]
name = "std-oom"
path = "src/oom/main.rs"
test = false
bench = false

[[bin]]
name = "std-threads"
path = "src/threads/main.rs"
test = false
bench = false

[[bin]]
name = "std-thread-exit"
path = "src/thread-exit/main.rs"
test = false
bench = false

[[bin]]
name = "std-thread-panic"
path = "src/thread-panic/main.rs"
test = false
bench = false

[[bin]]
name = "std-tls-main"
path = "src/tls-main/main.rs"
test = false
bench = false

[[bin]]
name = "std-thread-fault"
path = "src/thread-fault/main.rs"
test = false
bench = false

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "b2eb37e2af134e4bb4248df454c437b06c1f93c0" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "b2eb37e2af134e4bb4248df454c437b06c1f93c0" }

[[bin]]
name = "std-waits"
path = "src/waits/main.rs"
test = false
bench = false

[[bin]]
name = "std-backtrace"
path = "src/backtrace/main.rs"
test = false
bench = false

[[bin]]
name = "std-parallelism"
path = "src/parallelism/main.rs"
test = false
bench = false
