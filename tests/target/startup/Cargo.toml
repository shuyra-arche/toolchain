[package]
name = "toolchain-startup"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "toolchain-startup"
path = "src/main.rs"
test = false
bench = false

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "5da3ae3e0b971f34a003a31d344ee20593725e53" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "5da3ae3e0b971f34a003a31d344ee20593725e53" }

[profile.release]
panic = "abort"

[[bin]]
name = "std-launcher"
path = "src/launcher/main.rs"
test = false
bench = false
