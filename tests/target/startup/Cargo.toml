[package]
name = "toolchain-startup"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "toolchain-startup"
path = "src/main.rs"
test = false
bench = false

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", tag = "26.11.14-preview-Gamma" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", tag = "26.11.14-preview-Gamma" }

[profile.release]
panic = "abort"

[[bin]]
name = "std-launcher"
path = "src/launcher/main.rs"
test = false
bench = false
