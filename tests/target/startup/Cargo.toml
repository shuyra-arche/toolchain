[package]
name = "toolchain-startup"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "toolchain-startup"
path = "src/main.rs"
test = false
bench = false

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "12cb1b5ae7fcd57b46cc0103a0f30ea29631724e" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "12cb1b5ae7fcd57b46cc0103a0f30ea29631724e" }

[profile.release]
panic = "abort"

[[bin]]
name = "std-launcher"
path = "src/launcher/main.rs"
test = false
bench = false
