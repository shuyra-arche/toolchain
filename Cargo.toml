[package]
name = "shuyra-toolchain"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[bin]]
name = "shuyra-toolchain"
path = "src/main.rs"
test = false
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[[test]]
name = "bootstrap"
path = "tests/bootstrap/mod.rs"

[dev-dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "65e89e1fd52e7fdf14e8ddcb65e75219a5684144" }
kernel-api-v7 = { package = "kernel-api", git = "https://github.com/shuyra-arche/kernel.git", rev = "602ee97b8a4a5bc924c369c079c19ed00954e4c0" }

[[test]]
name = "qemu"
path = "tests/qemu/mod.rs"
