[package]
name = "shuyra-toolchain"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[bin]]
name = "shuyra-toolchain"
path = "src/main.rs"
test = false
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[[test]]
name = "bootstrap"
path = "tests/bootstrap/mod.rs"

[dev-dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "23dec6b30e1ec08f42d3701e2613acd8c562c459" }

[[test]]
name = "qemu"
path = "tests/qemu/mod.rs"
